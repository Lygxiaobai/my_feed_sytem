# 容器内配置。敏感项由 docker compose 从 .env 注入，缺失时启动即失败。
server:
  port: ${SERVER_PORT:-8080}

database:
  host: ${MYSQL_HOST:-mysql}
  port: ${MYSQL_PORT:-3306}
  user: ${MYSQL_USER:-root}
  password: ${MYSQL_PASSWORD}
  dbname: ${MYSQL_DATABASE:-my_feed_system}

redis:
  host: ${REDIS_HOST:-redis}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}

rabbitmq:
  host: ${RABBITMQ_HOST:-rabbitmq}
  port: ${RABBITMQ_PORT:-5672}
  username: ${RABBITMQ_USER:-admin}
  password: ${RABBITMQ_PASSWORD}
  vhost: ${RABBITMQ_VHOST:-/}
  prefetch_count: ${RABBITMQ_PREFETCH:-16}
  consumer_tag: ${RABBITMQ_CONSUMER_TAG:-feed-worker}

jwt:
  secret: ${JWT_SECRET}

upload:
  dir: ${UPLOAD_DIR:-/app/.run/uploads}
  max_video_bytes: ${MAX_VIDEO_BYTES:-268435456}

# 对象存储（Silo，S3 兼容）。
# endpoint 是容器网络内地址，public_endpoint 是浏览器直传时实际连接的地址；
# SigV4 把 Host 算进签名，两者不能混用。public_endpoint 留空则按同源直传。
storage:
  endpoint: ${SILO_ENDPOINT:-silo:9000}
  public_endpoint: ${SILO_PUBLIC_ENDPOINT:-}
  access_key: ${SILO_ACCESS_KEY}
  secret_key: ${SILO_SECRET_KEY}
  use_ssl: false
  bucket_uploads: ${SILO_BUCKET_UPLOADS:-feed-uploads}
  bucket_media: ${SILO_BUCKET_MEDIA:-feed-media}

pprof:
  api:
    enabled: ${PPROF_API_ENABLED:-false}
    addr: ${PPROF_API_ADDR:-0.0.0.0:6060}
  worker:
    enabled: ${PPROF_WORKER_ENABLED:-false}
    addr: ${PPROF_WORKER_ADDR:-0.0.0.0:6061}

metrics:
  # Worker 没有业务路由，指标需要单独开端口才能被 Prometheus 抓到。
  # 该端口只在 compose 网络内可达，不对宿主机发布。
  worker:
    enabled: true
    addr: 0.0.0.0:9101

log:
  level: ${LOG_LEVEL:-info}
  format: ${LOG_FORMAT:-json}

audit:
  # 审核总开关，默认关闭。打开后发布进入待审，通过才进入信息流。
  enabled: ${AUDIT_ENABLED:-false}
  block_word_file: /app/configs/audit/block-words.txt
  review_word_file: /app/configs/audit/review-words.txt
  # 未接入媒体审核能力时视频与封面的处置方式：review 转人工 / pass 直接放行。
  # 生产环境保持 review——没有能力审核就不能假装审过了。
  media_policy: review
  # 有人工复审权限的账号 ID。
  reviewer_account_ids: [1]

auth:
  email:
    test_domain: ${AUTH_EMAIL_TEST_DOMAIN:-lmr.com}
    code_ttl_seconds: ${AUTH_EMAIL_CODE_TTL:-600}
  smtp:
    host: ${SMTP_HOST:-smtp.163.com}
    port: ${SMTP_PORT:-465}
    tls: ${SMTP_TLS:-ssl}
    user: ${SMTP_USER:-}
    password: ${SMTP_PASSWORD:-}
    from: ${SMTP_FROM:-}

ops:
  loki_url: ${LOKI_URL:-http://loki:3100}
  prometheus_url: ${PROMETHEUS_URL:-http://prometheus:9090}

stripe:
  secret_key: ${STRIPE_SECRET_KEY:-}
  webhook_secret: ${STRIPE_WEBHOOK_SECRET:-}
  success_url: ${STRIPE_SUCCESS_URL:-https://lvmouren.indevs.in/wallet}
  currency: ${STRIPE_CURRENCY:-usd}

feed:
  # 关注流推拉结合的分级阈值。粉丝数低于 push_threshold 全量写扩散；
  # 介于两个阈值之间只推活跃粉丝；达到 pull_threshold 后完全不推，
  # 粉丝读关注流时从作者发件箱实时拉取。
  fanout:
    push_threshold: ${FEED_FANOUT_PUSH_THRESHOLD:-5000}
    pull_threshold: ${FEED_FANOUT_PULL_THRESHOLD:-100000}
    # 单条扩散消息处理的粉丝数。消费端单条消息有 10 秒上限，不宜调大。
    batch_size: ${FEED_FANOUT_BATCH_SIZE:-1000}
    inbox_max_size: ${FEED_FANOUT_INBOX_MAX_SIZE:-1000}
    outbox_max_size: ${FEED_FANOUT_OUTBOX_MAX_SIZE:-200}
    # 活跃标记存活时长，同时是收件箱的维护窗口。
    active_ttl_hours: ${FEED_FANOUT_ACTIVE_TTL_HOURS:-168}
    # 单次读取最多合并几个大V 发件箱，超过则退回 MySQL。
    max_pull_authors: ${FEED_FANOUT_MAX_PULL_AUTHORS:-20}
  recommend:
    small_creator_max_followers: ${RECOMMEND_SMALL_CREATOR_MAX_FOLLOWERS:-50}
    slot_small_ratio: ${RECOMMEND_SLOT_SMALL_RATIO:-0.2}
    mmr_lambda: ${RECOMMEND_MMR_LAMBDA:-0.7}

embedding:
  api_url: ${EMBEDDING_API_URL:-}
  api_key: ${EMBEDDING_API_KEY:-}
  model: ${EMBEDDING_MODEL:-text-embedding-3-small}
  timeout_seconds: ${EMBEDDING_TIMEOUT_SECONDS:-15}
