services:
  mysql:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    image: mysql:8.4
    container_name: my-feed-system-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: my_feed_system
      TZ: Asia/Shanghai
    command:
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    image: redis:7.4-alpine
    container_name: my-feed-system-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    image: rabbitmq:3.13-management
    container_name: my-feed-system-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: my-feed-system-backend:latest
    container_name: my-feed-system-backend
    environment:
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      VIDEO_UPLOAD_ORIGIN: ${VIDEO_UPLOAD_ORIGIN:-}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-false}
      # 关注流推拉分级阈值。API 侧只用到 pull_threshold 与 max_pull_authors，
      # 但两个进程读同一份配置文件，缺变量会让占位符落到不同默认值上，因此保持一致。
      FEED_FANOUT_PUSH_THRESHOLD: ${FEED_FANOUT_PUSH_THRESHOLD:-5000}
      FEED_FANOUT_PULL_THRESHOLD: ${FEED_FANOUT_PULL_THRESHOLD:-100000}
      FEED_FANOUT_BATCH_SIZE: ${FEED_FANOUT_BATCH_SIZE:-1000}
      FEED_FANOUT_INBOX_MAX_SIZE: ${FEED_FANOUT_INBOX_MAX_SIZE:-1000}
      FEED_FANOUT_OUTBOX_MAX_SIZE: ${FEED_FANOUT_OUTBOX_MAX_SIZE:-200}
      FEED_FANOUT_ACTIVE_TTL_HOURS: ${FEED_FANOUT_ACTIVE_TTL_HOURS:-168}
      FEED_FANOUT_MAX_PULL_AUTHORS: ${FEED_FANOUT_MAX_PULL_AUTHORS:-20}
      RECOMMEND_SMALL_CREATOR_MAX_FOLLOWERS: ${RECOMMEND_SMALL_CREATOR_MAX_FOLLOWERS:-50}
      RECOMMEND_SLOT_SMALL_RATIO: ${RECOMMEND_SLOT_SMALL_RATIO:-0.2}
      RECOMMEND_MMR_LAMBDA: ${RECOMMEND_MMR_LAMBDA:-0.7}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AUTH_EMAIL_TEST_DOMAIN: ${AUTH_EMAIL_TEST_DOMAIN:-lmr.com}
      AUTH_EMAIL_CODE_TTL: ${AUTH_EMAIL_CODE_TTL:-600}
      SMTP_HOST: ${SMTP_HOST:-smtp.163.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS: ${SMTP_TLS:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/configs/config.docker.yaml:/app/configs/config.yaml:ro
      - uploads_data:/app/.run/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ping | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    image: my-feed-system-backend:latest
    container_name: my-feed-system-worker
    environment:
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-false}
      # 写扩散完全在 Worker 侧执行，这几个阈值必须与 backend 保持一致。
      FEED_FANOUT_PUSH_THRESHOLD: ${FEED_FANOUT_PUSH_THRESHOLD:-5000}
      FEED_FANOUT_PULL_THRESHOLD: ${FEED_FANOUT_PULL_THRESHOLD:-100000}
      FEED_FANOUT_BATCH_SIZE: ${FEED_FANOUT_BATCH_SIZE:-1000}
      FEED_FANOUT_INBOX_MAX_SIZE: ${FEED_FANOUT_INBOX_MAX_SIZE:-1000}
      FEED_FANOUT_OUTBOX_MAX_SIZE: ${FEED_FANOUT_OUTBOX_MAX_SIZE:-200}
      FEED_FANOUT_ACTIVE_TTL_HOURS: ${FEED_FANOUT_ACTIVE_TTL_HOURS:-168}
      FEED_FANOUT_MAX_PULL_AUTHORS: ${FEED_FANOUT_MAX_PULL_AUTHORS:-20}
      RECOMMEND_SMALL_CREATOR_MAX_FOLLOWERS: ${RECOMMEND_SMALL_CREATOR_MAX_FOLLOWERS:-50}
      RECOMMEND_SLOT_SMALL_RATIO: ${RECOMMEND_SLOT_SMALL_RATIO:-0.2}
      RECOMMEND_MMR_LAMBDA: ${RECOMMEND_MMR_LAMBDA:-0.7}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    restart: unless-stopped
    command: ["/app/worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/configs/config.docker.yaml:/app/configs/config.yaml:ro
      - uploads_data:/app/.run/uploads

  frontend:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: my-feed-system-frontend:latest
    container_name: my-feed-system-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Tunnel 回源是 http://127.0.0.1:5173，这里必须继续发明文。
      - "${FRONTEND_PORT:-5173}:80"
      - "80:80"
      - "443:443"
      # 灰云上传备用口：未备案会拦 443，需在安全组放行 8443 后才能用。
      - "8443:8443"
    volumes:
      - /srv/my_feed_sytem-deploy/certbot/www:/var/www/certbot:ro
      - /srv/my_feed_sytem-deploy/certbot/live:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------- 可观测性栈 ----------------
  # 全部只监听 127.0.0.1：服务器对外仅开放 5173，监控入口通过 SSH 隧道访问，
  # 不新增任何公网攻击面。本机访问方式见 README。
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: my-feed-system-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 保留 15 天：指标体积远小于日志，这个窗口足够做周环比
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  loki:
    image: grafana/loki:3.3.2
    container_name: my-feed-system-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: my-feed-system-alloy
    restart: unless-stopped
    # 需要 root 才能读 Docker socket 与容器日志
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # 只读挂载 Docker socket：Alloy 只需要列容器和读日志流
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: my-feed-system-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 匿名仅 Viewer，且只给已过站点运维门禁的 /grafana/ 使用。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 默认 deny 会让浏览器把 iframe 显示成「拒绝了我们的连接请求」。
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-/grafana/}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
