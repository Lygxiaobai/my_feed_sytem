# 必须放在 http 上下文。conf.d 的文件是被 nginx.conf include 进来的，所以 map 写在 server 前面。
map $http_origin $upload_cors_origin {
  default "";
  "https://lvmouren.indevs.in" $http_origin;
  "http://124.221.158.195:5173" $http_origin;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 300m;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    include /etc/nginx/snippets/upload-api.conf;
  }

  # 分片直传兜底路径：SILO_PUBLIC_ENDPOINT 留空时前端按同源直传，
  # 经 Tunnel 走到这里（仍受约 100s 回源窗口限制，故大文件应配灰云直连）。
  location /feed-uploads/ {
    include /etc/nginx/snippets/silo-upload.conf;
  }

  location = /api/ops/gate {
    internal;
    set $backend_host backend;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8080;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $http_host;
  }

  location /grafana/ {
    auth_request /api/ops/gate;
    set $grafana_host grafana;
    proxy_pass http://$grafana_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_hide_header X-Frame-Options;
  }

  # 媒体读取直接落到对象存储，不再经 backend 发字节。
  # /static/videos/1.mp4 -> feed-media 桶的 videos/1.mp4，URL 形状不变，存量行无需迁移。
  location /static/ {
    set $silo_host silo;
    rewrite ^/static/(.*)$ /feed-media/$1 break;
    proxy_pass http://$silo_host:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 视频要边下边播，且 Silo 支持 Range，不能让 nginx 攒完再发。
    proxy_buffering off;
  }
}

# 灰云直连上传。只开放投稿 API 和 ACME，不提供整站。
server {
  listen 80;
  server_name upload.lvmouren.indevs.in;

  client_max_body_size 300m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location /api/ {
    include /etc/nginx/snippets/upload-api.conf;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 灰云 HTTPS。5173 是 Tunnel 回源明文口，不能改成 SSL。
# 不用 HTTP/2：多路大 POST 共用一条 H2 连接，中间设备一掐，全部变 499。
server {
  listen 443 ssl;
  listen 8443 ssl;
  http2 off;
  server_name upload.lvmouren.indevs.in;

  ssl_certificate /etc/nginx/certs/upload.lvmouren.indevs.in/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/upload.lvmouren.indevs.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 300m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location /api/ {
    include /etc/nginx/snippets/upload-api.conf;
  }

  # 分片直传主路径：绕开 Cloudflare 的约 100s 回源窗口，字节不经过 backend。
  location /feed-uploads/ {
    include /etc/nginx/snippets/silo-upload.conf;
  }

  location / {
    return 404;
  }
}
