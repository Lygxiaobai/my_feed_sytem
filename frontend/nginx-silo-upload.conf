# 预签名直传的透传入口。浏览器把分片直接 PUT 到对象存储，字节不经过 backend。
#
# 三条不能动的约束：
#   1. Host 必须原样透传。SigV4 把 Host 算进签名，改成 silo:9000 会一律 403 SignatureDoesNotMatch。
#   2. 路径必须原样，不能 rewrite。预签名签的是 /feed-uploads/... 这个确切路径，改一个字节签名就废。
#   3. 不要在这里加任何 CORS 头。Silo 自己已按 api.cors_allow_origin 白名单发
#      Access-Control-Allow-Origin 和 Access-Control-Expose-Headers（含 Etag），
#      nginx 再加一份会变成重复头，浏览器直接判失败。
set $silo_host silo;
proxy_pass http://$silo_host:9000;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 分片边收边转。攒满再转会让上传中途被掐时对象存储侧完全没记录，
# 也会把 4MiB 分片压进 nginx 内存。
proxy_request_buffering off;
proxy_buffering off;
client_body_timeout 300s;
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
